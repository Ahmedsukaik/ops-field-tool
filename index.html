<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#1B5E4B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Field Tool">
<title>Field Tool</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="n-favicon.png" sizes="64x64">
<link rel="apple-touch-icon" href="n-apple.png">
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#F2F3F0;color:#16211D;
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:24px}
@media (prefers-color-scheme:dark){body{background:#0E1411;color:#E9EEEA}}
#lock{width:100%;max-width:340px;text-align:center;opacity:0;transition:opacity .25s}
#lock.ready{opacity:1}
.mk{width:64px;height:64px;margin:0 auto 20px;border-radius:16px;background:#1B5E4B;
  display:grid;place-items:center}
.mk i{width:26px;height:26px;border:2.5px solid #FBFBFA;border-radius:50%;display:block;position:relative}
.mk i::after{content:"";position:absolute;inset:8px;background:#FBFBFA;border-radius:50%}
h1{font-size:17px;font-weight:600;margin:0 0 6px}
p.s{font-size:13px;opacity:.65;margin:0 0 22px;line-height:1.7}
label{display:block;text-align:start;font-size:12px;opacity:.7;margin:0 0 5px}
input[type=text],input[type=password]{width:100%;padding:11px 13px;font-size:15px;border-radius:8px;
  border:1px solid #C6CDC4;background:#FBFBFA;color:inherit;margin-bottom:13px;font-family:inherit}
@media (prefers-color-scheme:dark){input[type=text],input[type=password]{background:#151C18;border-color:#35443C}}
.rw{display:flex;align-items:center;gap:8px;font-size:12.5px;opacity:.75;margin-bottom:16px;text-align:start}
button{width:100%;padding:12px;font-size:15px;font-weight:600;border:0;border-radius:8px;
  background:#1B5E4B;color:#fff;cursor:pointer;font-family:inherit}
button:disabled{opacity:.55;cursor:default}
#lm{font-size:12.5px;margin-top:13px;min-height:18px;opacity:.75}
#lm.err{color:#9E2F26;opacity:1}
</style>
</head>
<body>
<div id="lock">
  <div class="mk"><i></i></div>
  <h1>الدخول</h1>
  <p class="s">أداة ميدانية خاصة. المحتوى مشفّر بالكامل ولا يُفتح إلا ببيانات الدخول.</p>
  <form id="lf" autocomplete="off">
    <label for="lu">اسم المستخدم</label>
    <input id="lu" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="lp">كلمة المرور</label>
    <input id="lp" type="password" autocomplete="current-password" required>
    <div class="rw"><input id="lr" type="checkbox" checked style="width:auto;margin:0"><label for="lr" style="margin:0">أبقني داخلاً على هذا الجهاز</label></div>
    <button type="submit">دخول</button>
  </form>
  <div id="lm"></div>
</div>
<div id="app"></div>
<script>window.APP_BUILD="202608201411";</script>
<script src="boot.js"></script>
</body>
</html>
